[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baselayer"
version = "0.4.0"
description = "The interpretive layer above memory. Turns text into a portable specification of how a specific person interprets information, decides, and communicates. MCP server, behavioral predicate grammar, three-layer authoring."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Aarik Gulaya"},
]
keywords = ["ai", "llm", "claude", "anthropic", "mcp", "ai-personalization", "ai-memory", "agent-alignment", "behavioral-specification", "interpretive-layer", "behavioral-prediction"]

dependencies = [
    "anthropic~=0.45",
    "chromadb~=0.6",
    "sentence-transformers~=3.0",
    "numpy~=1.26",
    "python-docx~=0.8",
    "requests~=2.31",
    "httpx>=0.24",
    "mcp[cli]~=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
baselayer = "baselayer.cli:main"
baselayer-mcp = "baselayer.mcp_server:main"

[project.urls]
Homepage = "https://base-layer.ai"
Repository = "https://github.com/agulaya24/BaseLayer"
Documentation = "https://base-layer.ai/llms-full.txt"
"Bug Tracker" = "https://github.com/agulaya24/BaseLayer/issues"

[tool.setuptools]
# Only ship the active package surface. Dev-internal subpackages
# (baselayer.archive, baselayer.archive.dead_pipeline_steps, baselayer.experiments)
# remain on disk for developers but are excluded from the distribution.
packages = ["baselayer"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.exclude-package-data]
baselayer = ["archive/*", "archive/**/*", "experiments/*", "experiments/**/*"]

[tool.pytest.ini_options]
# Confine collection to the canonical suite. Without this, a bare `pytest` from
# the repo root also collects stray test_*.py under scripts/archive/one_off/ and
# the vendored data/external_datasets/ tree, which fail to import and produce
# collection errors that mask an otherwise green suite. Run: `pytest` or `pytest tests/`.
testpaths = ["tests"]
